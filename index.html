    <!-- Apply the saved theme before first paint so there's no flash. -->
    <script>
      (function () {
        var themes = { ember: 1, phosphor: 1, amber: 1, dracula: 1, paper: 1 };
        try {
          var saved = localStorage.getItem("portfolio-theme");
          if (saved && themes[saved]) document.documentElement.dataset.theme = saved;
        } catch (e) {}
      })();
    </script>
